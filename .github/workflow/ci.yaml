name: Lore CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Test Next.js Build
        run: npx next build
        env:
          CREW_JWT_SECRET: "dummy-ci-secret"
          LORE_DB_HOST: "localhost"
          LORE_DB_PORT: "5432"
          LORE_DB_NAME: "lore"
          LORE_DB_USER: "lore"
          LORE_DB_PASS: "dummy"
