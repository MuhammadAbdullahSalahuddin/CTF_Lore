services:
  lore:
    build: .
    ports: ["3001:3000"]
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis]
    networks: [lore-net]

  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    container_name: lore_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
      POSTGRES_DB: lore
    volumes:
      - lore_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [lore-net]

  redis:
    image: redis:latest
    restart: unless-stopped
    container_name: lore_redis
    command: redis-server --requirepass lore
    ports:
      - "6379:6379"
    networks: [lore-net]
    volumes:
      - lore_redisdata:/data

networks:
  lore-net:
    driver: bridge

volumes:
  lore_pgdata:
  lore_redisdata:
